name: Docker

# A release tag publishes the image to GHCR, for Intel and Arm machines:
# v0.1.0 becomes ghcr.io/bybash/explain-it:0.1.0, :0.1 and :latest.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    name: build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Not only the repository's MIT: the image carries GPL and LGPL parts (NOTICE.md).
          labels: |
            org.opencontainers.image.licenses=MIT AND GPL-3.0-or-later AND LGPL-3.0-or-later AND GPL-2.0-or-later
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
